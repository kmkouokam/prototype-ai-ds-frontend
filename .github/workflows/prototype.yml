name: ⚙️ Node.js CI/CD Workflow

on:
  push:
    branches:
      - carine
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  build-and-deploy:
    name: 🚀 Build, Scan & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📆 Install Dependencies
        run: npm install

      - name: 💠 Build Project
        run: npm run build || true

      - name: 🧱 Ensure dist Directory Exists
        run: |
          if [ ! -d "dist" ]; then
            mkdir dist
            echo "<html><body><h1>Dummy Build</h1></body></html>" > dist/index.html
          fi

      - name: 🧹 Lint Code (ESLint)
        run: |
          npm install eslint --save-dev || true
          npx eslint . --ext .js,.ts

      - name: 🛡️ Fix Vulnerabilities (npm audit fix)
        run: npm audit fix --force || true

      - name: 📊 Generate Audit Report (JSON)
        run: npm audit --json > audit-report.json || true

      - name: 📁 Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json

      - name: 🔍 Run Node.jsScan (Static Analysis)
        run: |
          pip install nodejsscan
          mkdir -p nodejsscan-reports
          find . -type f -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./dist/*" \
            -not -path "./coverage/*" \
            -not -path "./.build/*" \
            -not -path "./.next/*" > files_to_scan.txt
          nodejsscan -f $(cat files_to_scan.txt) -o nodejsscan-reports/report.json

      - name: 🧪 (Optional) Run Unit Tests
        if: false # change to `true` or remove to enable
        run: npm test

      - name: 📦 Archive Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: ☁️ Upload to S3 (Env-specific)
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: ${{ github.ref == 'refs/heads/main' && secrets.AWS_S3_BUCKET_PROD || secrets.AWS_S3_BUCKET_STAGING }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          SOURCE_DIR: dist

      - name: 📰 Post-Deployment Notification
        run: |
            echo "Deployment completed to ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }} environment." > deployment-report.txt
            echo "Date: $(date)" >> deployment-report.txt
            echo "Commit: $GITHUB_SHA" >> deployment-report.txt
            echo "Actor: $GITHUB_ACTOR" >> deployment-report.txt
  
      - name: 📁 Upload Deployment Report
        uses: actions/upload-artifact@v4
        with:
            name: deployment-report
            path: deployment-report.txt    

      - name: 📢 Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: "Build *${{ job.status }}* for *${{ github.repository }}* on `${{ github.ref }}`"
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_CHANNEL: '#all-internship'
 ######