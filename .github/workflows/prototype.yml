name: Node.js CI

on:
  push:
    branches: ["carine"]
  pull_request:
    branches: ["carine"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '0.8' # Specify the Node.js version you want to use
          cache: 'npm'

      - name: clean up node_modules
        run: |
          echo "Cleaning up node_modules..."
          rm -rf node_modules package-lock.json 
          npm cahe clean --force
          npm cache verify   

      - name: run check update
        run: |
          npm install -g npm-check-updates
          npx npm-check-updates    

      - name: apply updates
        run: |
          npx npm-check-updates -u
          npm install    

      # - name: Install dependencies
      #   run: npm install

      - name: Debug autoprefixer install
        run: ls -la node_modules/autoprefixer || echo "autoprefixer NOT installed"

      # Optional: Reinstall if needed (debugging)
      - name: Force reinstall autoprefixer
        run: |
          if [ ! -d "node_modules/autoprefixer" ]; then
            echo "Reinstalling autoprefixer..."
            npm install autoprefixer --save-dev
          else
            echo "autoprefixer is already installed."
          fi
          

       

      - name: Run ts-prune
        run: |
           npm install -D ts-prune && npx ts-prune 
           npm fund
           npm audit fix --force 
         

      - name: install ts-prune globaly
        run: |
          npm install -g ts-prune 
          npm fund
          npm audit fix --force
        
      
        
      - name:   run npm audit fix
        run: |
           npm uninstall @types/react-chartjs-2 uuid
           npm install uuid@latest
           npm fund
           npm audit fix --force
           npm audit fix 

      - name: Build CSS (uses PostCSS)
        run: npm run build # or the script that triggers PostCSS (e.g., `vite build` or `next build`)

      - name: Run tests
        run: npm test

      - name: run audit
        run: npm audit fix --force  