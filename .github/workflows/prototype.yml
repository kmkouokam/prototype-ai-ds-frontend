name: Node.js CI

on:
  push:
    branches: ["carine"]
  pull_request:
    branches: ["carine"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Debug autoprefixer install
        run: ls -la node_modules/autoprefixer || echo "autoprefixer NOT installed"

      # Optional: Reinstall if needed (debugging)
      # - name: Force reinstall autoprefixer
      #   run: npm install autoprefixer --save-dev

       

      - name: Run ts-prune
        run: npm install -D ts-prune && npx ts-prune 
        continue-on-error: true

      - name: install ts-prune globaly
        run: npm install -g ts-prune  
        
      - name:   run npm audit fix
        run: |
           npm uninstall @types/react-chartjs-2 uuid
           npm install uuid@latest
           npm fund
           npm audit fix --force
           npm audit fix 

      - name: Build CSS (uses PostCSS)
        run: npm run build # or the script that triggers PostCSS (e.g., `vite build` or `next build`)

      - name: Run tests
        run: npm test

      - name: run audit
        run: npm audit fix --force  