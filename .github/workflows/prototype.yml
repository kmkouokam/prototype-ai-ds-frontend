# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["carine"]
  pull_request:
    branches: ["carine"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
         working-directory: ./  # Set the working directory for all steps in the job
        

    steps:
      - uses: actions/checkout@v4
      - name:   Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'  # Specify the Node.js version to use
          cache: 'npm'  # Enable caching for npm dependencies
      - name: Install dependencies
        run: npm install  # Install the project dependencies using npm
      - name: Build
        run: npm run build  # Build the project using npm
      - name: Run tests
        run: npm test  # Run the tests using npm
