name: Node.js CI

on:
  push:
    branches: ["carine"]
  pull_request:
    branches: ["carine"]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Initialize CodeQL
      #   uses: github/codeql-action/init@v3
      #   with:
      #     languages: javascript  

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Use the latest LTS version
          # cache: 'npm'

      - name: install dependencies
        run: |
          npm install
           
      - name: run build
        run: |
          npm run build || true
          
      - name: run tests (no test implemented)
        run: echo "no test implemented yet"

      - name: run eslint #This will catch bad coding practices and some security issues
        run: |
          npm install eslint --save-dev
          npx eslint . --ext .js,.ts 

      - name: run audit for vulnerabilities
        run: |
          # npm audit --audit-level=high || true
          npm audit fix --force  || true  

      - name: run nodejsScan (with folder exclusion)
        run: |
          pip install nodejsscan
          mkdir -p nodejsscan-reports
          find . -type f -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./dist/*" \
            -not -path "./coverage/*" \
            -not -path "./.build/*" \
            -not -path "./.next/*" \
            > files_to_scan.txt
            nodejsscan -f $(cat files_to_scan.txt) -o nodejsscan-reports/report.json
      
      - name: Notify Slack  #Store your webhook URL as a secret (SLACK_WEBHOOK) in your repo settings @https://api.slack.com/messaging/webhooks
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
              SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
              SLACK_MESSAGE: "Build ${{ job.status }} for ${{ github.repository }} on ${{ github.ref }}"
           #Webhook URL for Slack notifications: https://join.slack.com/t/internship-rma1183/shared_invite/zt-35s0h7vip-5J8D~M_3QpLfp9YqVwMrPA
              SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
              SLACK_CHANNEL: '#all-internship'

      # - name: Run unit tests
      #   run: npm test
        
      - name: Archive build artifacts #store build artifacts to github
        if: success()
        uses: actions/upload-artifact@v4
        with:
                name: build-artifacts
                path: |
                  dist/



    #or to s3 bucket
      - name: Upload to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read --delete
        env:
          AWS_S3_BUCKET: refontebucket 
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          SOURCE_DIR: dist
     
                           
      
