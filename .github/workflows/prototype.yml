name: Node.js CI

on:
  push:
    branches: ["carine"]
  pull_request:
    branches: ["carine"]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Initialize CodeQL
      #   uses: github/codeql-action/init@v3
      #   with:
      #     languages: javascript  

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Use the latest LTS version
          # cache: 'npm'

      - name: install dependencies
        run: |
          npm install
           
      - name: run build
        run: |
          npm run build || true
          
      - name: run tests (no test implemented)
        run: "no test implemented yet"

      - name: run eslint #This will catch bad coding practices and some security issues
        run: |
          npm install eslint --save-dev
          npx eslint . --ext .js,.ts 

      - name: run audit for vulnerabilities
        run: |
          # npm audit --audit-level=high || true
          npm audit fix --force  || true  

      - name: run nodejsScan (with folder exclusion)
        run: |
          pip install nodejsscan
          mkdir -p nodejsscan-reports
          find . -type f -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./dist/*" \
            -not -path "./coverage/*" \
            -not -path "./.build/*" \
            -not -path "./.next/*" \
            > files_to_scan.txt
            nodejsscan -f $(files_to_scan.txt) -o nodejsscan-reports/report.json
          
