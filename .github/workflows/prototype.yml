name: Node.js CI

on:
  push:
    branches: ["carine"]
  pull_request:
    branches: ["carine"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Debug autoprefixer install
        run: ls -la node_modules/autoprefixer || echo "autoprefixer NOT installed"

      # Optional: Reinstall if needed (debugging)
      # - name: Force reinstall autoprefixer
      #   run: npm install autoprefixer --save-dev

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Run ts-prune
        run: npm install -D ts-prune && npx ts-prune --all --ignore-unknown --ignore-dependencies --ignore-exports --ignore-imports --ignore-reexports --ignore-duplicates --ignore-duplicates-in-reexports --ignore-duplicates-in-imports --ignore-duplicates-in-exports --ignore-duplicates-in-reexports --ignore-duplicates-in-dependencies --ignore-duplicates-in-dependencies-in-reexports --ignore-duplicates-in-dependencies-in-imports --ignore-duplicates-in-dependencies-in-exports --ignore-duplicates-in-dependencies-in-reexports --ignore-duplicates-in-dependencies-in-dependencies --ignore-duplicates-in-dependencies-in-dependencies-in-reexports --ignore-duplicates-in-dependencies-in-dependencies-in-imports --ignore-duplicates-in-dependencies-in-dependencies-in-exports --ignore-duplicates-in-dependencies-in-dependencies-in-reexports
        